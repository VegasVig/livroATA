<!DOCTYPE html>
<!-- livro-ata-pages v4 -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Livro ATA">
<title>Livro ATA Digital — Vegas Vigilância</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
html,body{margin:0;height:100%;background:#0d0f13;color:#c9ced6;font:16px/1.4 system-ui,sans-serif;overflow:hidden}
iframe{position:fixed;left:0;right:0;bottom:0;top:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#0d0f13}
body.com-barra iframe{top:52px;height:calc(100% - 52px);padding-top:0}
#espera{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
#espera img{width:96px;height:96px;border-radius:14px}
#espera a{color:#5aa9ff}
#espera small{max-width:320px;opacity:.75}
#barra{display:none;position:fixed;top:0;left:0;right:0;height:52px;box-sizing:border-box;padding:0 8px 0 12px;align-items:center;gap:10px;background:#171b21;border-bottom:1px solid #2e3540;z-index:5}
body.com-barra #barra{display:flex}
#barra img{width:30px;height:30px;border-radius:6px}
#barra span{flex:1;font-size:.9rem}
#barra button{min-height:36px;border-radius:6px;border:0;font:600 .9rem system-ui;cursor:pointer}
#btnInstalar{padding:0 14px;background:linear-gradient(180deg,#f7f8fa,#c3c9d1 46%,#a3abb6 54%,#e6e9ed);color:#14171c}
#btnFechar{background:none;color:#c9ced6;padding:0 10px;font-size:1.4rem}
</style>
</head>
<body>
<div id="espera"><img src="icon-192.png" alt="Vegas Vigilância"><span>Abrindo o Livro ATA…</span><small id="lento" hidden>Demorando? <a id="direto" href="#" target="_blank" rel="noopener">Abrir direto</a></small></div>
<iframe id="app" title="Livro ATA Digital" allow="clipboard-write"></iframe>
<div id="barra"><img src="icon-192.png" alt=""><span id="txtInstalar">Instale o Livro ATA neste aparelho.</span><button id="btnInstalar" type="button">Instalar</button><button id="btnFechar" type="button" aria-label="Fechar">×</button></div>
<script>
const URL_APP = 'https://script.google.com/macros/s/AKfycbzXTasTzX6HUKaBXEUtFTZpYL-Xp70utrGbJVZy2qmZ40E-GrzxLNXg6CYE3y1_YJYb/exec';
const f = document.getElementById('app');
document.getElementById('direto').href = URL_APP;
f.src = URL_APP;
f.onload = () => setTimeout(() => { const e = document.getElementById('espera'); if (e) e.remove(); }, 300);
setTimeout(() => { const l = document.getElementById('lento'); if (l) l.hidden = false; }, 8000);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

const instalado = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: minimal-ui)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
let pedido = null, dispensado = false;
function atualizarBarra() {
  const mostrar = !instalado() && !dispensado && (pedido || isIOS);
  document.body.classList.toggle('com-barra', !!mostrar);
  document.getElementById('btnInstalar').hidden = !pedido;
  if (isIOS && !pedido) document.getElementById('txtInstalar').textContent = 'Para instalar: Compartilhar → Adicionar à Tela de Início.';
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedido = e; atualizarBarra(); });
window.addEventListener('appinstalled', () => { pedido = null; atualizarBarra(); });
matchMedia('(display-mode: standalone)').addEventListener('change', atualizarBarra);
document.getElementById('btnInstalar').onclick = async () => {
  if (!pedido) return;
  pedido.prompt();
  await pedido.userChoice;
  pedido = null; atualizarBarra();
};
document.getElementById('btnFechar').onclick = () => { dispensado = true; atualizarBarra(); };
atualizarBarra();
</script>
</body>
</html>
