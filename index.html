<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Livro ATA">
<title>Livro ATA Digital — Vegas Vigilância</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
html,body{margin:0;height:100%;background:#0d0f13;color:#c9ced6;font:16px/1.4 system-ui,sans-serif;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#0d0f13}
#espera{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
#espera img{width:96px;height:96px;border-radius:14px}
#espera a{color:#5aa9ff}
#espera small{max-width:320px;opacity:.75}
</style>
</head>
<body>
<div id="espera"><img src="icon-192.png" alt="Vegas Vigilância"><span>Abrindo o Livro ATA…</span><small id="lento" hidden>Demorando? <a id="direto" href="#" target="_blank" rel="noopener">Abrir direto</a></small></div>
<iframe id="app" title="Livro ATA Digital" allow="clipboard-write"></iframe>
<script>
const URL_APP = 'https://script.google.com/macros/s/AKfycbzXTasTzX6HUKaBXEUtFTZpYL-Xp70utrGbJVZy2qmZ40E-GrzxLNXg6CYE3y1_YJYb/exec';
const f = document.getElementById('app');
document.getElementById('direto').href = URL_APP;
f.src = URL_APP;
f.onload = () => setTimeout(() => document.getElementById('espera').remove(), 300);
setTimeout(() => { const l = document.getElementById('lento'); if (l) l.hidden = false; }, 8000);
</script>
</body>
</html>
