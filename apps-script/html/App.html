<script>
(function () {
'use strict';

const ICON = {
  painel: '<path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/>',
  livro: '<path d="M5 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5zM5 3v18M9 7h6M9 11h6"/>',
  busca: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  posto: '<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  equipe: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  auditoria: '<path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  config: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 0 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 1.2 14H1a2 2 0 0 1 0-4h.1A1.7 1.7 0 0 0 4.6 7a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 1.2V1a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.1a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  caneta: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/>',
  rascunho: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  meus: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  sair: '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>',
  pdf: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15l3 3 3-3"/>',
  voltar: '<path d="M15 18l-6-6 6-6"/>',
  inicio: '<path d="M3 11 12 3l9 8M5 9.5V21h14V9.5"/>'
};
const ico = n => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICON[n] || '') + '</svg>';

const NAV = {
  ADMIN: [['painel', 'Painel', 'painel'], ['livros', 'Livros', 'livro'], ['registros', 'Registros', 'busca'], ['postos', 'Postos', 'posto'], ['equipe', 'Equipe', 'equipe'], ['auditoria', 'Auditoria', 'auditoria'], ['config', 'Configurações', 'config']],
  SUPERVISOR: [['painel', 'Painel', 'painel'], ['livros', 'Livros', 'livro'], ['registros', 'Registros', 'busca'], ['equipe', 'Equipe', 'equipe']],
  FUNCIONARIO: [['inicio', 'Início', 'inicio'], ['escrever', 'Escrever', 'caneta'], ['rascunhos', 'Rascunhos', 'rascunho'], ['meus', 'Meus registros', 'meus']]
};
const PERFIL_NOME = { ADMIN: 'Administrador geral', SUPERVISOR: 'Supervisor de posto', FUNCIONARIO: 'Vigilante' };

const st = { token: '', user: null, view: '', params: {}, opcoes: null };
try { st.token = sessionStorage.getItem('ata_t') || ''; } catch (e) {}

const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDT = iso => { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };
const fmtD = s => { if (!s) return '—'; const p = String(s).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : s; };
const hoje = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'America/Sao_Paulo' });
const pad = (n, t) => String(n).padStart(t, '0');
const dispositivo = () => navigator.userAgent.slice(0, 240);
const carregando = (t) => '<div class="carregando">' + esc(t || 'Carregando…') + '</div>';
const vazio = t => '<div class="vazio">' + t + '</div>';
const selo = s => s === 'ABERTO' ? '<span class="selo aberto">Aberto</span>' : '<span class="selo encerrado">Encerrado</span>';

function toast(msg, tipo) {
  const el = document.createElement('div');
  el.className = 'toast ' + (tipo || '');
  el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(() => el.remove(), tipo === 'erro' ? 6000 : 3500);
}

function rpc(acao, payload) {
  return new Promise((ok, falha) => {
    google.script.run.withSuccessHandler(ok).withFailureHandler(e => ok({ ok: false, erro: 'Falha de conexão. Verifique a internet e tente de novo.', codigo: 'NET', detalhe: String(e) })).api(acao, st.token, payload || {});
  });
}

async function call(acao, payload, tentativa) {
  const r = await rpc(acao, payload);
  if (r.ok) return r.dados;
  if (r.codigo === 'SESSION') { sair(true); toast(r.erro, 'erro'); throw r; }
  if (r.codigo === 'PIN_CHANGE') { telaTrocarPin(); throw r; }
  if (r.codigo === 'CONSULTA' && !tentativa) {
    const liberado = await pedirSenhaConsulta();
    if (liberado) return call(acao, payload, true);
  }
  throw r;
}

function erro(e) { if (e && e.codigo !== 'SESSION' && e.codigo !== 'PIN_CHANGE') toast(e.erro || String(e), 'erro'); }

function salvarToken(t) { st.token = t; try { t ? sessionStorage.setItem('ata_t', t) : sessionStorage.removeItem('ata_t'); } catch (e) {} }

/* ---------- modal ---------- */
function modal(titulo, corpo, opt) {
  fecharModal();
  const f = document.createElement('div');
  f.className = 'modal-fundo';
  f.innerHTML = '<div class="modal ' + ((opt && opt.largo) ? 'largo' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(titulo) + '"><header><h3>' + esc(titulo) + '</h3>' + (opt && opt.semFechar ? '' : '<button class="btn btn-texto" data-fechar>Fechar</button>') + '</header><div class="modal-corpo">' + corpo + '</div></div>';
  $('#modal-root').appendChild(f);
  f.addEventListener('click', e => { if (e.target.hasAttribute('data-fechar') || (e.target === f && !(opt && opt.semFechar))) fecharModal(); });
  const foco = $('input,select,textarea,button:not([data-fechar])', f);
  if (foco) setTimeout(() => foco.focus(), 30);
  return f;
}
function fecharModal() { $('#modal-root').innerHTML = ''; }

function confirmar(titulo, texto, rotulo, perigo) {
  return new Promise(ok => {
    const m = modal(titulo, '<p>' + texto + '</p><div class="acoes"><button class="btn ' + (perigo ? 'btn-perigo' : 'btn-metal') + '" data-sim>' + esc(rotulo || 'Confirmar') + '</button><button class="btn" data-nao>Cancelar</button></div>');
    $('[data-sim]', m).onclick = () => { fecharModal(); ok(true); };
    $('[data-nao]', m).onclick = () => { fecharModal(); ok(false); };
  });
}

function pedirSenhaConsulta() {
  return new Promise(ok => {
    const m = modal('Senha de consulta', '<p class="muted">Os livros são protegidos por uma senha adicional de consulta. Ela vale até você sair do sistema.</p><form data-f><div class="campo"><label for="sc">Senha de consulta</label><input id="sc" type="password" autocomplete="off" required></div><div class="acoes"><button class="btn btn-metal" type="submit">Liberar consulta</button><button class="btn" type="button" data-cancel>Cancelar</button></div></form>');
    $('[data-cancel]', m).onclick = () => { fecharModal(); ok(false); };
    $('[data-f]', m).onsubmit = async ev => {
      ev.preventDefault();
      const b = $('button[type=submit]', m); b.disabled = true;
      const r = await rpc('desbloquearConsulta', { senha: $('#sc', m).value });
      b.disabled = false;
      if (r.ok) { st.user = r.dados; fecharModal(); ok(true); } else toast(r.erro, 'erro');
    };
  });
}

/* ---------- login ---------- */
function telaLogin() {
  st.user = null;
  document.title = 'Livro ATA Digital — Vegas Vigilância';
  $('#app').innerHTML = '<main class="login"><div class="login-arte" role="img" aria-label="Livro ATA Digital Vegas Vigilância"></div><section class="login-painel">' +
    '<h1>Entrar no Livro ATA</h1><p class="sub">Use sua matrícula e seu PIN pessoal.</p>' +
    '<form id="fl"><div class="campo"><label for="lm">Matrícula</label><input id="lm" autocomplete="username" autocapitalize="characters" required></div>' +
    '<div class="campo"><label for="lp">PIN</label><input id="lp" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="current-password" required></div>' +
    '<button class="btn btn-metal btn-bloco" type="submit">Entrar</button></form>' +
    '<p class="login-rodape">Esqueceu o PIN? Fale com seu supervisor ou com a administração.</p></section></main>';
  $('#fl').onsubmit = async ev => {
    ev.preventDefault();
    const b = $('#fl button'); b.disabled = true; b.textContent = 'Entrando…';
    const r = await rpc('login', { login: $('#lm').value, pin: $('#lp').value, dispositivo: dispositivo() });
    b.disabled = false; b.textContent = 'Entrar';
    if (!r.ok) { toast(r.erro, 'erro'); $('#lp').value = ''; $('#lp').focus(); return; }
    salvarToken(r.dados.token); st.user = r.dados.usuario;
    if (st.user.trocarPin) telaTrocarPin(); else iniciarApp();
  };
}

function telaTrocarPin() {
  $('#app').innerHTML = '<main class="login"><div class="login-arte"></div><section class="login-painel"><h1>Crie seu PIN</h1><p class="sub">Por segurança, troque o PIN provisório. Ele será usado para entrar e para assinar seus registros. Não compartilhe.</p>' +
    '<form id="ft"><div class="campo"><label for="pa">PIN atual (provisório)</label><input id="pa" class="pin" type="password" inputmode="numeric" maxlength="8" required></div>' +
    '<div class="campo"><label for="pn">Novo PIN</label><input id="pn" class="pin" type="password" inputmode="numeric" maxlength="8" required><span class="ajuda">De 4 a 8 números. Evite sequências e números repetidos.</span></div>' +
    '<div class="campo"><label for="pc">Repita o novo PIN</label><input id="pc" class="pin" type="password" inputmode="numeric" maxlength="8" required></div>' +
    '<button class="btn btn-metal btn-bloco" type="submit">Salvar novo PIN</button><button class="btn btn-texto btn-bloco" type="button" id="ts">Sair</button></form></section></main>';
  $('#ts').onclick = () => sair();
  $('#ft').onsubmit = async ev => {
    ev.preventDefault();
    if ($('#pn').value !== $('#pc').value) return toast('Os PINs digitados não conferem.', 'erro');
    try { st.user = await call('trocarPin', { atual: $('#pa').value, novo: $('#pn').value }); toast('PIN salvo.', 'ok'); iniciarApp(); } catch (e) { erro(e); }
  };
}

async function sair(silencioso) {
  if (!silencioso && st.token) await rpc('logout', {});
  salvarToken('');
  fecharModal();
  telaLogin();
}

/* ---------- casca ---------- */
async function iniciarApp() {
  try {
    if (!st.user) st.user = await call('me');
    if (st.user.trocarPin) return telaTrocarPin();
    st.opcoes = await call('opcoes');
  } catch (e) { if (e.codigo !== 'PIN_CHANGE' && e.codigo !== 'SESSION') { erro(e); telaLogin(); } return; }
  const nav = NAV[st.user.perfil];
  const botoes = nav.map(n => '<button class="nav-item" data-v="' + n[0] + '">' + ico(n[2]) + '<span>' + n[1] + '</span></button>').join('');
  $('#app').innerHTML = '<div class="fundo"></div><div class="casca">' +
    '<nav class="lateral" aria-label="Menu"><div class="marca"><img src="' + window.VEGAS_LOGO + '" alt="Vegas Vigilância"><div><b>Livro ATA Digital</b><span>Vegas Vigilância</span></div></div>' + botoes +
    '<div class="usuario"><b>' + esc(st.user.nome) + '</b><small>' + esc(PERFIL_NOME[st.user.perfil]) + ' · ' + esc(st.user.login) + '</small><button class="nav-item" data-sair>' + ico('sair') + 'Sair</button></div></nav>' +
    '<div><header class="topo-movel"><img src="' + window.VEGAS_LOGO + '" alt=""><b>Livro ATA Digital</b><button class="btn btn-texto" data-sair aria-label="Sair">' + ico('sair') + '</button></header>' +
    '<main class="conteudo" id="v"></main></div>' +
    '<nav class="barra-inferior" aria-label="Menu">' + nav.map(n => '<button class="nav-item" data-v="' + n[0] + '">' + ico(n[2]) + '<span>' + n[1] + '</span></button>').join('') + '</nav></div>';
  $$('[data-v]').forEach(b => b.onclick = () => ir(b.dataset.v));
  $$('[data-sair]').forEach(b => b.onclick = () => sair());
  ir(nav[0][0]);
}

function ir(view, params) {
  st.view = view; st.params = params || {};
  const permitidas = NAV[st.user.perfil].map(n => n[0]).concat(['livro']);
  $$('[data-v]').forEach(b => { if (b.dataset.v === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const v = $('#v'); v.innerHTML = carregando();
  window.scrollTo(0, 0);
  const fn = VIEWS[view];
  if (!fn || permitidas.indexOf(view) < 0) { v.innerHTML = vazio('Tela indisponível para o seu perfil.'); return; }
  Promise.resolve(fn(v, st.params)).catch(e => { erro(e); v.innerHTML = vazio(esc(e.erro || 'Não foi possível carregar.') + '<br><br><button class="btn" onclick="location.reload()">Recarregar</button>'); });
}

const opt = (lista, val, vazioTxt) => (vazioTxt !== undefined ? '<option value="">' + esc(vazioTxt) + '</option>' : '') + lista.map(o => '<option value="' + esc(o[0]) + '"' + (o[0] === val ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('');
const optPostos = (v, t) => opt(st.opcoes.postos.map(p => [p.id, p.codigo + ' — ' + p.nome]), v, t);
const optFunc = (v, t) => opt(st.opcoes.funcionarios.map(f => [f.id, f.nome + ' (' + f.matricula + ')']), v, t);
const optLivros = (v, t) => opt(st.opcoes.livros.map(l => [l.id, l.codigo + ' — ' + l.postoNome + (l.status === 'ENCERRADO' ? ' (encerrado)' : '')]), v, t);
async function recarregarOpcoes() { st.opcoes = await call('opcoes'); }

/* ---------- views ---------- */
const VIEWS = {};

VIEWS.painel = async function (v) {
  v.innerHTML = '<div class="cabecalho"><div><h2 class="titulo">Painel</h2><p>' + (st.user.perfil === 'ADMIN' ? 'Visão de todos os postos.' : 'Postos sob sua responsabilidade.') + '</p></div></div>' +
    '<form class="filtros" id="fp"><div class="campo"><label>Posto</label><select name="postoId">' + optPostos('', 'Todos') + '</select></div>' +
    '<div class="campo"><label>Funcionário</label><select name="funcionarioId">' + optFunc('', 'Todos') + '</select></div>' +
    '<div class="campo"><label>Livro</label><select name="livroId">' + optLivros('', 'Todos') + '</select></div>' +
    '<div class="campo"><label>De</label><input type="date" name="de"></div><div class="campo"><label>Até</label><input type="date" name="ate"></div>' +
    '<button class="btn" type="submit">Aplicar filtros</button></form><div id="pr">' + carregando() + '</div>';
  const carregar = async () => {
    const f = Object.fromEntries(new FormData($('#fp')));
    $('#pr').innerHTML = carregando();
    const d = await call('inicio', f);
    const t = d.totais;
    const cats = Object.entries(d.porCategoria).sort((a, b) => b[1] - a[1]);
    const max = Math.max(1, ...cats.map(c => c[1]));
    $('#pr').innerHTML = '<div class="numeros"><div><b>' + t.postos + '</b><span>Postos</span></div><div><b>' + t.livrosAbertos + '</b><span>Livros abertos</span></div><div><b>' + t.livrosEncerrados + '</b><span>Livros encerrados</span></div><div><b>' + t.registros + '</b><span>Registros assinados</span></div><div><b>' + t.funcionarios + '</b><span>Funcionários ativos</span></div><div class="' + (t.aguardandoEncerramento ? 'destaque' : '') + '"><b>' + t.aguardandoEncerramento + '</b><span>Aguardando encerramento</span></div></div>' +
      '<div class="grade g2"><section class="painel"><h3>Últimos registros</h3><div class="lista">' +
      (d.ultimos.length ? d.ultimos.map(r => '<button class="item" data-l="' + r.livroId + '" data-r="' + r.id + '"><b>' + esc(r.livroCodigo) + ' · nº ' + pad(r.numero, 4) + '</b><span class="pequeno muted">' + fmtDT(r.finalizadoEm) + '</span><small>' + esc(r.funcionarioNome) + ' — ' + esc(r.categoria || 'Sem categoria') + ' — ' + esc(r.postoNome) + '</small></button>').join('') : vazio('Nenhum registro no período.')) +
      '</div></section><div class="grade"><section class="painel"><h3>Livros aguardando encerramento</h3><p class="pequeno muted">Abertos há mais de 30 dias ou com mais de 300 registros.</p><div class="lista">' +
      (d.aguardando.length ? d.aguardando.map(l => '<button class="item" data-l="' + l.id + '"><b>' + esc(l.codigo) + '</b><span class="selo alerta">' + l.diasAberto + ' dias</span><small>' + esc(l.postoNome) + ' — ' + l.totalRegistros + ' registros</small></button>').join('') : vazio('Nenhum livro pendente.')) +
      '</div></section><section class="painel"><h3>Registros por categoria</h3><div class="barras">' + (cats.length ? cats.map(c => '<div><span>' + esc(c[0]) + '</span><i style="width:' + Math.round(c[1] / max * 100) + '%"></i><b>' + c[1] + '</b></div>').join('') : vazio('Sem dados.')) + '</div></section></div></div>';
    $$('#pr [data-l]').forEach(b => b.onclick = () => ir('livro', { id: b.dataset.l, reg: b.dataset.r }));
  };
  $('#fp').onsubmit = e => { e.preventDefault(); carregar().catch(erro); };
  await carregar();
};

VIEWS.livros = async function (v) {
  const sup = st.user.perfil === 'SUPERVISOR';
  v.innerHTML = '<div class="cabecalho"><div><h2 class="titulo">Livros ATA</h2><p>Cada posto tem seu próprio histórico de livros.</p></div>' + (sup ? '<button class="btn btn-metal" id="nl">' + ico('livro') + 'Abrir novo livro</button>' : '') + '</div>' +
    '<div class="filtros"><div class="campo"><label>Posto</label><select id="lp">' + optPostos('', 'Todos') + '</select></div><div class="campo"><label>Situação</label><select id="ls"><option value="">Todas</option><option value="ABERTO">Abertos</option><option value="ENCERRADO">Encerrados</option></select></div></div><div id="ll">' + carregando() + '</div>';
  const carregar = async () => {
    $('#ll').innerHTML = carregando();
    const l = await call('listarLivros', { postoId: $('#lp').value, status: $('#ls').value });
    $('#ll').innerHTML = l.length ? '<div class="painel"><div class="lista">' + l.map(x => '<button class="item" data-l="' + x.id + '"><b>' + esc(x.codigo) + ' · ' + esc(x.postoNome) + '</b>' + selo(x.status) + '<small>Livro nº ' + x.numero + ' · aberto em ' + fmtD(x.dataAbertura) + ' por ' + esc(x.supervisorNome) + ' · ' + x.totalRegistros + ' registros' + (x.status === 'ENCERRADO' ? ' · encerrado em ' + fmtDT(x.encerradoEm) : '') + (x.aguardandoEncerramento ? ' · <span style="color:var(--alerta)">aguardando encerramento</span>' : '') + '</small></button>').join('') + '</div></div>' : vazio(sup ? 'Nenhum livro ainda. Abra o primeiro livro do seu posto.' : 'Nenhum livro encontrado.');
    $$('#ll [data-l]').forEach(b => b.onclick = () => ir('livro', { id: b.dataset.l }));
  };
  $('#lp').onchange = $('#ls').onchange = () => carregar().catch(erro);
  if (sup) $('#nl').onclick = () => modalNovoLivro(carregar);
  await carregar();
};

function checksFuncionarios(postoId, marcados) {
  const l = st.opcoes.funcionarios.filter(f => f.ativo && f.postoIds.indexOf(postoId) >= 0);
  if (!l.length) return '<div class="aviso alerta">Nenhum funcionário ativo vinculado a este posto. Peça à administração para vincular a equipe.</div>';
  return '<div class="checks">' + l.map(f => '<label class="check"><input type="checkbox" name="aut" value="' + f.id + '"' + (marcados.indexOf(f.id) >= 0 ? ' checked' : '') + '>' + esc(f.nome) + ' <span class="muted pequeno">' + esc(f.matricula) + '</span></label>').join('') + '</div>';
}

function modalNovoLivro(depois) {
  if (!st.opcoes.postos.length) return toast('Você ainda não tem postos vinculados. Fale com a administração.', 'erro');
  const p0 = st.opcoes.postos[0];
  const m = modal('Abrir novo Livro ATA', '<form id="fn"><div class="campo"><label>Posto</label><select name="postoId" id="np">' + optPostos(p0.id) + '</select></div>' +
    '<div class="campo"><label>Nome do posto no livro</label><input name="postoNome" id="nn" value="' + esc(p0.nome) + '" maxlength="120" required></div>' +
    '<div class="campo"><label>Data de abertura</label><input type="date" name="dataAbertura" value="' + hoje() + '" required></div>' +
    '<div class="campo"><label>Funcionários autorizados a escrever</label><div id="na">' + checksFuncionarios(p0.id, []) + '</div></div>' +
    '<p class="pequeno muted">O número do livro, o horário de abertura e o termo de abertura são gerados pelo sistema.</p>' +
    '<button class="btn btn-metal btn-bloco" type="submit">Abrir livro</button></form>', { largo: true });

async function carregarAssinaturas(livroId, v) {
  const alvos = $$('[data-ass]', v);
  for (let i = 0; i < alvos.length; i += 40) {
    const lote = alvos.slice(i, i + 40);
    try {
      const imgs = await call('assinaturas', { livroId: livroId, ids: lote.map(x => x.dataset.ass) });
      lote.forEach(x => { if (imgs[x.dataset.ass]) x.innerHTML = '<img alt="Assinatura" src="' + imgs[x.dataset.ass] + '">'; });
    } catch (e) { return; }
  }
}

async function verificarLivro(livroId) {
  modal('Verificação de integridade', carregando('Recalculando a cadeia de hashes…'));
  try {
    const r = await call('verificarIntegridade', { livroId: livroId });
    modal('Verificação de integridade', '<div class="aviso ' + (r.ok ? 'ok' : 'erro') + '">' + (r.ok ? 'Íntegro. Os ' + r.totalRegistros + ' registros, assinaturas e termos conferem com a cadeia de hashes.' : 'Foram encontradas divergências. Comunique a administração imediatamente.') + '</div>' +
      (r.problemas.length ? '<ul>' + r.problemas.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '') + '<p class="hash">Último hash: ' + esc(r.ultimoHash) + '<br>Verificado em ' + fmtDT(r.verificadoEm) + '</p>');
  } catch (e) { fecharModal(); erro(e); }
}

  modal('Quem já assinou', carregando());

function modalAutorizados(l) {
  const m = modal('Funcionários autorizados — ' + l.codigo, '<form id="fa">' + checksFuncionarios(l.postoId, l.autorizados.map(a => a.id)) + '<p class="pequeno muted">Remover a autorização não apaga registros já assinados.</p><button class="btn btn-metal btn-bloco" type="submit">Salvar autorizados</button></form>');
  $('#fa', m).onsubmit = async ev => {
    ev.preventDefault();
    try { await call('atualizarAutorizados', { livroId: l.id, autorizados: new FormData(ev.target).getAll('aut') }); fecharModal(); toast('Autorizados atualizados.', 'ok'); ir('livro', { id: l.id }); } catch (e) { erro(e); }
  };
}

function encerrarLivro(l) {
  const m = modal('Encerrar ' + l.codigo, '<div class="aviso alerta">Depois de encerrado, o livro não aceita novos registros. Os registros e assinaturas ficam preservados para consulta e PDF.</div><form id="fe"><div class="campo"><label>Observação de encerramento (opcional)</label><textarea name="obs" maxlength="1000"></textarea></div><button class="btn btn-perigo btn-bloco" type="submit">Encerrar livro</button></form>');
  $('#fe', m).onsubmit = async ev => {
    ev.preventDefault();
    const obs = ev.target.obs.value;
    try {
      let r = await call('encerrarLivro', { livroId: l.id, obs: obs });
      if (r.pendente) {
        const ok = await confirmar('Rascunhos não assinados', 'Há ' + r.rascunhos + ' rascunho(s) não assinado(s) neste livro. Eles não entrarão no livro e não poderão mais ser assinados. Encerrar mesmo assim?', 'Encerrar mesmo assim', true);
        if (!ok) return;
        r = await call('encerrarLivro', { livroId: l.id, obs: obs, forcar: true });
      }
      fecharModal(); toast('Livro encerrado.', 'ok'); await recarregarOpcoes(); ir('livro', { id: l.id });
    } catch (e) { erro(e); }
  };
}

  const aba = st.params.aba || 'FUNCIONARIO';

    l.map(p => '<tr><td>' + esc(p.nome) + (p.email ? '<br><span class="muted pequeno">' + esc(p.email) + '</span>' : '') + '</td><td>' + esc(p.matricula) + '</td>' + (aba !== 'ADMIN' ? '<td>' + (p.postoIds.map(nomePosto).join(', ') || '—') + '</td>' : '') +

      (aba === 'SUPERVISOR' ? '<div class="campo"><label>E-mail</label><input type="email" name="email" value="' + esc(p.email || '') + '"></div>' : '') +
      (comPostos ? '<div class="campo"><label>' + (aba === 'SUPERVISOR' ? 'Postos sob responsabilidade' : 'Postos autorizados') + '</label><div class="checks">' + (st.opcoes.postos.length ? st.opcoes.postos.map(x => '<label class="check"><input type="checkbox" name="postos" value="' + x.id + '"' + (p.postoIds.indexOf(x.id) >= 0 ? ' checked' : '') + '>' + esc(x.codigo + ' — ' + x.nome) + '</label>').join('') : '<span class="muted">Cadastre postos primeiro.</span>') + '</div></div>' : '') +

  });

  const m = modal('Revisar e assinar', '<div class="folha-escrita" style="margin-bottom:16px"><div class="folha"><div class="entrada" style="margin:0"><div class="meta"><b>' + esc(r.livro.codigo) + '</b><span>' + esc(r.livro.postoNome) + '</span><span>' + esc(st.user.nome) + '</span><span>' + esc(r.ret ? 'Retificação do nº ' + pad(r.ret.numero, 3) : (r.categoria || 'Sem categoria')) + '</span></div><p class="texto">' + esc(r.texto) + '</p></div></div></div>' +
    '<p class="pequeno muted">Confira o texto. Depois de assinado, ele não poderá ser editado nem excluído — apenas retificado por um novo registro.</p>' +
    '<div class="campo"><label>Assinatura manuscrita</label><div class="quadro"><canvas id="cv"></canvas><div class="linha-base"></div><div class="dica">Assine com o dedo ou caneta</div></div><div class="acoes" style="justify-content:flex-end"><button class="btn btn-texto" id="cl" type="button">Limpar assinatura</button></div></div>' +
    '<label class="declaracao"><input type="checkbox" id="cd"><span>' + esc(st.opcoes.declaracao) + '</span></label><br>' +
    '<div class="campo"><label for="cp">Seu PIN</label><input id="cp" class="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></div>' +
    '<div class="acoes"><button class="btn btn-metal" id="ca">Assinar registro</button><button class="btn" data-fechar>Voltar e editar</button></div>', { largo: true, semFechar: true });
  const pad_ = assinaturaPad($('#cv', m));
  $('#cl', m).onclick = () => pad_.limpar();
  $('#ca', m).onclick = async () => {
    if (pad_.vazio()) return toast('Faça sua assinatura no quadro.', 'erro');
    if (!$('#cd', m).checked) return toast('Marque a declaração para confirmar a autoria.', 'erro');
    if (!$('#cp', m).value) return toast('Digite seu PIN.', 'erro');
    const b = $('#ca', m); b.disabled = true; b.textContent = 'Assinando…';
    try {
      const f = await call('finalizarRegistro', { id: r.id, versao: r.atualizadoEm, assinatura: pad_.exportar(), declaracao: true, pin: $('#cp', m).value, dispositivo: dispositivo() });
      modal('Registro assinado', '<div class="sucesso"><p>Registro nº <b>' + pad(f.numero, 4) + '</b> gravado no livro ' + esc(r.livro.codigo) + ' em ' + fmtDT(f.finalizadoEm) + '.</p><p class="muted pequeno">Código de integridade</p><p class="codigo">' + esc(f.codigoIntegridade) + '</p><p class="hash">SHA-256 ' + esc(f.hashRegistro) + '</p></div><div class="acoes"><button class="btn btn-metal" id="sv">Ver no livro</button><button class="btn" id="sn">Novo registro</button></div>', { semFechar: true });
      $('#sv').onclick = () => { fecharModal(); ir('livro', { id: f.livroId, reg: f.id }); };
      $('#sn').onclick = () => { fecharModal(); ir('escrever', { livroId: f.livroId }); };
    } catch (e) { erro(e); b.disabled = false; b.textContent = 'Assinar registro'; $('#cp', m).value = ''; }
  };
}

function assinaturaPad(cv) {
  const ctx = cv.getContext('2d');
  let tracos = [], atual = null;
  const ajustar = () => {
    const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    cv.width = r.width * d; cv.height = r.height * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0d1b33';
    redesenhar();
  };
  const redesenhar = () => { ctx.clearRect(0, 0, cv.width, cv.height); tracos.forEach(t => { ctx.beginPath(); t.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); }); };
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); atual = [pos(e)]; tracos.push(atual); });
  cv.addEventListener('pointermove', e => { if (!atual) return; e.preventDefault(); const p = pos(e), a = atual[atual.length - 1]; atual.push(p); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); });
  const fim = () => { atual = null; };
  cv.addEventListener('pointerup', fim); cv.addEventListener('pointercancel', fim); cv.addEventListener('pointerleave', fim);
  window.addEventListener('resize', ajustar);
  setTimeout(ajustar, 20);
  return {
    limpar() { tracos = []; redesenhar(); },
    vazio() { return tracos.reduce((n, t) => n + t.length, 0) < 15; },
    exportar() {
      const pts = [].concat.apply([], tracos);
      let x0 = Math.min(...pts.map(p => p[0])) - 6, y0 = Math.min(...pts.map(p => p[1])) - 6, x1 = Math.max(...pts.map(p => p[0])) + 6, y1 = Math.max(...pts.map(p => p[1])) + 6;
      const w = x1 - x0, h = y1 - y0;
      for (let escala = Math.min(1.5, 600 / w, 200 / h); escala > 0.2; escala *= 0.8) {
        const o = document.createElement('canvas');
        o.width = Math.max(40, Math.round(w * escala)); o.height = Math.max(20, Math.round(h * escala));
        const c = o.getContext('2d');
        c.setTransform(escala, 0, 0, escala, -x0 * escala, -y0 * escala);
        c.lineWidth = 2.4; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#0d1b33';
        tracos.forEach(t => { c.beginPath(); t.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke(); });
        const url = o.toDataURL('image/png');
        if (url.length < 47000) return url;
      }
      throw { erro: 'Assinatura muito complexa. Limpe e assine novamente.' };
    }
  };
}

/* ---------- PDF ---------- */
const latin = s => String(s == null ? '' : s).replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/[\u2013\u2014]/g, '-').replace(/\u2026/g, '...').replace(/[^\x09\x0A\x0D\x20-\xFF]/g, '?');

async function gerarPdf(livroId, botao) {
  if (!window.jspdf) return toast('Biblioteca de PDF não carregou. Verifique a internet e recarregue.', 'erro');
  const txtB = botao.innerHTML; botao.disabled = true; botao.textContent = 'Gerando PDF…';
  try {
    const d = await call('dadosPdf', { livroId: livroId });
    const doc = construirPdf(d);
    const b64 = doc.output('datauristring').split(',')[1];
    const s = await call('salvarPdf', { livroId: livroId, base64: b64 });
    try { doc.save(s.nome); } catch (e) {}
    modal('PDF gerado', '<p>O PDF foi salvo no Google Drive, na pasta do livro.</p><p class="hash">SHA-256 do arquivo: ' + esc(s.sha256) + '</p><div class="acoes"><a class="btn btn-metal" href="' + esc(s.url) + '" target="_blank" rel="noopener">Abrir PDF no Drive</a></div>');
  } catch (e) { erro(e); }
  botao.disabled = false; botao.innerHTML = txtB;
}

function construirPdf(d) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const L = d.livro, W = 210, H = 297, ME = 20, MD = 15, TOP = 34, BASE = H - 20, larg = W - ME - MD;
  let y = TOP;
  const novaPagina = () => { doc.addPage(); y = TOP; };
  const garantir = h => { if (y + h > BASE) novaPagina(); };
  const escrever = (texto, tam, estilo, cor, entre) => {
    doc.setFont(estilo === 'mono' ? 'courier' : 'helvetica', estilo === 'b' ? 'bold' : 'normal'); doc.setFontSize(tam); doc.setTextColor(cor || 20);
    const lh = tam * 0.42 + (entre || 1.4);
    doc.splitTextToSize(latin(texto), larg).forEach(l => { garantir(lh); doc.text(l, ME, y); y += lh; });
  };
  doc.setFillColor(20, 23, 28); doc.rect(0, 0, W, 92, 'F');
  try { doc.addImage(window.VEGAS_LOGO, 'JPEG', ME, 16, 44, 40); } catch (e) {}
  doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(24); doc.text('LIVRO ATA DIGITAL', 72, 32);
  doc.setFontSize(13); doc.setTextColor(200, 205, 212); doc.text('VEGAS VIGILÂNCIA', 72, 41);
  doc.setFont('helvetica', 'italic'); doc.setFontSize(10); doc.text(latin(d.app.slogan), 72, 50);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor(255); doc.text(latin('Livro nº ' + L.numero + ' — ' + L.codigo), ME, 76);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(200, 205, 212); doc.text(latin(L.postoNome + (d.posto && d.posto.endereco ? ' — ' + d.posto.endereco : '')), ME, 84);
  y = 106;
  const linhaInfo = (k, val) => { escrever(k + ': ' + val, 10.5, '', 40, 1.2); };
  linhaInfo('Situação', L.status === 'ABERTO' ? 'Aberto' : 'Encerrado');
  linhaInfo('Data de abertura', fmtD(L.dataAbertura) + ' (registrado em ' + fmtDT(L.abertoEm) + ')');
  linhaInfo('Supervisor responsável', L.supervisorNome);
  linhaInfo('Encerramento', L.status === 'ENCERRADO' ? fmtDT(L.encerradoEm) + ' por ' + L.encerradoPorNome : '—');
  linhaInfo('Total de registros assinados', String(L.totalRegistros));
  linhaInfo('Verificação de integridade na emissão', d.verificacao.ok ? 'ÍNTEGRO' : 'DIVERGÊNCIAS ENCONTRADAS (' + d.verificacao.problemas.length + ')');
  linhaInfo('Emitido em', fmtDT(d.geradoEm) + ' por ' + d.geradoPor);
  y += 4;
  escrever('TERMO DE ABERTURA', 12, 'b', 20, 2);
  escrever('Este livro, de número ' + L.numero + ', destina-se ao registro das ocorrências e comunicações do posto ' + L.postoNome + ', sob responsabilidade da Vegas Vigilância. Aberto em ' + fmtD(L.dataAbertura) + ' pelo supervisor ' + L.supervisorNome + '. Funcionários autorizados: ' + L.autorizados.map(a => a.nome + ' (' + a.matricula + ')').join('; ') + '.', 10.5, 'mono', 30, 1.8);
  escrever('Hash de abertura: ' + L.hashGenese, 8, 'mono', 110, 1);
  if (!d.verificacao.ok) { y += 3; escrever('ATENÇÃO — divergências na verificação: ' + d.verificacao.problemas.join(' | '), 9, 'b', 160, 1.2); }

  novaPagina();
  d.registros.forEach(r => {
    garantir(30);
    doc.setDrawColor(200); doc.line(ME, y - 4, W - MD, y - 4);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(20);
    doc.text(latin('Registro nº ' + pad(r.numero, 4)), ME, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(80);
    doc.text(latin(fmtDT(r.finalizadoEm) + '   ' + (r.categoria || 'Sem categoria')), W - MD, y, { align: 'right' });
    y += 5.5;
    escrever(r.funcionarioNome + ' — matrícula ' + r.matricula, 9.5, '', 60, 1.2);
    if (r.tipo === 'RETIFICACAO') escrever('Retificação do registro nº ' + pad(r.retificaNumero, 4) + (r.retificaLivroCodigo && r.retificaLivroCodigo !== L.codigo ? ' do livro ' + r.retificaLivroCodigo : ''), 9.5, 'b', 150, 1.2);
    if (r.retificadoPor.length) escrever('Retificado pelo registro ' + r.retificadoPor.map(x => 'nº ' + pad(x.numero, 4) + (x.livroCodigo !== L.codigo ? ' (' + x.livroCodigo + ')' : '')).join(', ') + '. Texto original preservado abaixo.', 9.5, 'b', 150, 1.2);
    y += 1.5;
    escrever(r.texto, 10.5, 'mono', 25, 1.8);
    garantir(26);
    if (r.assinatura) { try { const p = doc.getImageProperties(r.assinatura); const h = 16, w = Math.min(60, p.width / p.height * h); doc.addImage(r.assinatura, 'PNG', ME, y, w, h); } catch (e) {} }
    doc.setDrawColor(60); doc.line(ME, y + 17, ME + 70, y + 17);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(60);
    doc.text(latin(r.funcionarioNome + ' — assinado com PIN e assinatura manuscrita em ' + fmtDT(r.finalizadoEm)), ME, y + 21);
    y += 25;
    escrever('Integridade ' + r.codigoIntegridade + ' · SHA-256 ' + r.hashRegistro, 7.5, 'mono', 110, 1);
    y += 6;
  });
  if (!d.registros.length) escrever('Nenhum registro assinado neste livro.', 10.5, 'mono', 90);

  garantir(40); y += 4;
  escrever(L.status === 'ENCERRADO' ? 'TERMO DE ENCERRAMENTO' : 'SITUAÇÃO NA EMISSÃO', 12, 'b', 20, 2);
  escrever(L.status === 'ENCERRADO' ? 'Livro encerrado em ' + fmtDT(L.encerradoEm) + ' por ' + L.encerradoPorNome + ', contendo ' + L.totalRegistros + ' registro(s) assinado(s).' + (L.obsEncerramento ? ' Observação: ' + L.obsEncerramento : '') : 'Livro aberto. Este documento reflete os ' + L.totalRegistros + ' registro(s) assinados até ' + fmtDT(d.geradoEm) + '.', 10.5, 'mono', 30, 1.8);
  escrever('Último hash da cadeia: ' + L.ultimoHash + (L.hashEncerramento ? ' · Hash de encerramento: ' + L.hashEncerramento : ''), 8, 'mono', 110, 1);

  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    if (i > 1) {
      doc.setFillColor(20, 23, 28); doc.rect(0, 0, W, 22, 'F');
      try { doc.addImage(window.VEGAS_LOGO, 'JPEG', ME, 3, 17.6, 16); } catch (e) {}
      doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text('LIVRO ATA DIGITAL · VEGAS VIGILÂNCIA', 42, 10);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(200, 205, 212); doc.text(latin(L.codigo + ' — ' + L.postoNome), 42, 16);
    }
    doc.setDrawColor(180); doc.line(ME, H - 14, W - MD, H - 14);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(110);
    doc.text(latin('Vegas Vigilância · ' + L.codigo + ' · emitido em ' + fmtDT(d.geradoEm)), ME, H - 9);
    doc.text('Página ' + i + ' de ' + n, W - MD, H - 9, { align: 'right' });
  }
  return doc;
}

/* ---------- boot ---------- */
if (st.token) iniciarApp(); else telaLogin();
})();
</script>
